<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 190" role="img"><style>.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><path class="pulse" d="M120 97H530" stroke="var(--accent)" stroke-width="4"/><g transform="translate(30,55)"><rect width="180" height="84" rx="8" fill="var(--surface-2)" stroke="var(--line)"/><text x="90" y="32" text-anchor="middle" fill="var(--text)" font-size="14"><tspan data-lang="en">Select equipment</tspan><tspan data-lang="es">Seleccionar equipo</tspan></text><circle cx="90" cy="60" r="7" fill="var(--accent)"/></g><g transform="translate(235,55)"><rect width="180" height="84" rx="8" fill="var(--surface-2)" stroke="var(--line)"/><text x="90" y="32" text-anchor="middle" fill="var(--text)" font-size="14"><tspan data-lang="en">Trace the process</tspan><tspan data-lang="es">Seguir el proceso</tspan></text><circle cx="90" cy="60" r="7" fill="var(--accent)"/></g><g transform="translate(440,55)"><rect width="180" height="84" rx="8" fill="var(--surface-2)" stroke="var(--line)"/><text x="90" y="32" text-anchor="middle" fill="var(--text)" font-size="14"><tspan data-lang="en">Inspect evidence</tspan><tspan data-lang="es">Revisar evidencia</tspan></text><circle cx="90" cy="60" r="7" fill="var(--accent)"/></g></svg>